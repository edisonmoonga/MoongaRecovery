<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPRS Location Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; margin-top: 50px; }
        h2 { color: #1e293b; }
        p { color: #475569; line-height: 1.5; }
        button { background-color: #3b82f6; color: white; padding: 15px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; }
        button:hover { background-color: #2563eb; }
        .status { margin-top: 20px; font-weight: bold; color: #10b981; }
        .error { margin-top: 20px; font-weight: bold; color: #dc3545; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Moonga Phone Recovery System</h2>
        <p>Your investigator has requested a location update for Case <strong>#{{ case_id }}</strong>.</p>
        <p>Please click the button below and tap <strong>"Allow"</strong> to share your live location.</p>
        
        <button id="shareBtn" onclick="startTracking()">Start Live Tracking</button>
        
        <div id="status" class="status"></div>
        <div id="error" class="error"></div>
    </div>

    <script>
        let trackingInterval;

        function startTracking() {
            if (navigator.geolocation) {
                document.getElementById("shareBtn").disabled = true;
                document.getElementById("shareBtn").innerText = "Tracking Active...";
                
                // Get location immediately
                navigator.geolocation.getCurrentPosition(sendLocation, showError);
                
                // Then get location every 15 seconds
                trackingInterval = setInterval(function() {
                    navigator.geolocation.getCurrentPosition(sendLocation, showError);
                }, 15000); 
                
            } else {
                document.getElementById("error").innerHTML = "Geolocation is not supported by this browser.";
            }
        }

        function sendLocation(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            var accuracy = position.coords.accuracy; // How accurate the GPS is in meters
            
            document.getElementById("status").innerHTML = "Live tracking active. Sending updates every 15s... (Accuracy: ~" + Math.round(accuracy) + " meters)";
            
            fetch('/api/location/{{ case_id }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ latitude: lat, longitude: lon })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Location sent to MPRS.");
            })
            .catch((error) => {
                console.error("Error sending location:", error);
            });
        }

        function showError(error) {
            var errorDiv = document.getElementById("error");
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    errorDiv.innerHTML = "You denied the request for Geolocation. Please allow it to help us find your phone."
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorDiv.innerHTML = "Location information is unavailable."
                    break;
                case error.TIMEOUT:
                    errorDiv.innerHTML = "The request to get user location timed out."
                    break;
                case error.UNKNOWN_ERROR:
                    errorDiv.innerHTML = "An unknown error occurred."
                    break;
            }
        }
    </script>
</body>
</html>
